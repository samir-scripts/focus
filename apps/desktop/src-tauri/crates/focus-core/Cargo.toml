[package]
name = "focus-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
