[package]
name = "focus-desktop"
version = "0.1.0"
edition = "2021"
default-run = "focus-desktop"

[workspace]
members = ["crates/focus-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
focus-core = { path = "crates/focus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSEvent", "NSWindow", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-core-foundation"] }
