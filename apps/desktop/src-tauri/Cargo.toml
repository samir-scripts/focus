[package]
name = "focus-desktop"
version = "0.1.0"
edition = "2021"
default-run = "focus-desktop"

[features]
default = ["fixture-admin"]
fixture-admin = []
policy-helper = []

[[bin]]
name = "focus-fixture-admin"
path = "src/bin/focus-fixture-admin.rs"
required-features = ["fixture-admin"]

[[bin]]
name = "focus-browser-policy"
path = "src/bin/focus-browser-policy.rs"
required-features = ["policy-helper"]
test = false

[workspace]
members = ["crates/focus-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
focus-core = { path = "crates/focus-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
tauri-plugin-single-instance = "2"
dirs = "6"
plist = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
hmac = "0.12"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSButton", "NSEvent", "NSRunningApplication", "NSWindow", "NSWorkspace", "block2", "libc"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSData", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-core-foundation"] }
