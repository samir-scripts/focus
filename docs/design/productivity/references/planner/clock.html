  color-scheme: light;
  --font-ui: 'Focus Bitmap', 'Mona Sans', system-ui, sans-serif;
  --font-code: 'Focus Bitmap', 'Mona Sans Mono', ui-monospace, monospace;
  --font-display: 'Focus Bitmap Display', var(--font-ui);
  --font-wordmark: 'Focus Bitmap Wordmark', var(--font-code);
  --canvas: var(--light-paper);
  --surface: var(--light-surface);
  --rail: var(--light-rail);
  --ink: var(--light-ink);
  --muted: var(--light-muted);
  --divider: var(--light-divider);
  --edge: var(--light-edge);
  --accent: var(--light-accent);
  --on-accent: var(--light-on-accent);
  --secondary: var(--light-secondary);
  --selected: var(--light-selected);
  --grain-paper: .113;
  --grain-rail: .071;
  --toner-opacity: 1;
  --warning: #66430f;
  --error: #8a302c;
  --radius-control: 3px;
  --radius-notice: 4px;
  --radius-dialog: 6px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --motion-interaction: 150ms;
  --motion-hover: 280ms;
  --motion-press: 80ms;
  --motion-view: 220ms;
  --motion-exit: 120ms;
  --motion-toner-sweep: 485ms;
}

html[data-theme='dark'] {
  color-scheme: dark;
  --canvas: var(--dark-paper);
  --surface: var(--dark-surface);
  --rail: var(--dark-rail);
  --ink: var(--dark-ink);
  --muted: var(--dark-muted);
  --divider: var(--dark-divider);
  --edge: var(--dark-edge);
  --accent: var(--dark-accent);
  --on-accent: var(--dark-on-accent);
  --secondary: var(--dark-secondary);
  --selected: var(--dark-selected);
  --grain-paper: .056;
  --grain-rail: .041;
  --toner-opacity: .54;
  --warning: #f2cd92;
  --error: #f1a5a5;
}

@media (prefers-color-scheme: dark) {
  html:not([data-theme]), html[data-theme='system'] {
    color-scheme: dark;
    --canvas: var(--dark-paper);
    --surface: var(--dark-surface);
    --rail: var(--dark-rail);
    --ink: var(--dark-ink);
    --muted: var(--dark-muted);
    --divider: var(--dark-divider);
    --edge: var(--dark-edge);
    --accent: var(--dark-accent);
    --on-accent: var(--dark-on-accent);
    --secondary: var(--dark-secondary);
    --selected: var(--dark-selected);
    --grain-paper: .056;
    --grain-rail: .041;
    --toner-opacity: .54;
    --warning: #f2cd92;
    --error: #f1a5a5;
  }
}

[data-swatch$='-light'] { --swatch-paper: var(--light-paper); --swatch-ink: var(--light-accent); }
[data-swatch$='-dark'] { --swatch-paper: var(--dark-paper); --swatch-ink: var(--dark-accent); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-interaction: 0ms;
    --motion-hover: 0ms;
    --motion-press: 0ms;
    --motion-view: 0ms;
    --motion-exit: 0ms;
  }

  *, *::before, *::after {
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0ms !important;
  }
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--canvas); font: 16px/1.4 var(--font-ui); }
main { max-width: 38rem; padding: 0 18px; margin: 32px auto; }
article, dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--edge); border-radius: var(--radius-dialog); padding: 22px; }
h1, h2 { margin: 0 0 16px; }
h1 { font-size: 23px; }

<main>
  <article aria-labelledby="title-heading">
    <h1 id="title-heading">Edit reminder</h1>
    <label class="field">
      <span class="field-name"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14l1-4L11 2l3 3-8 8zM9 4l3 3"/></svg>Title</span>
      <input id="title" value="Send review notes">
    </label>
    <div class="field">
      <span class="field-name"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8l2 2v8l-2 2H4l-2-2V4zM8 4v4h3"/></svg>Time</span>
      <button class="key time-trigger" id="open-clock" type="button" aria-haspopup="dialog">

    <div class="actions">
      <button class="key remove" type="button"><span class="key-face">Delete…</span></button>
      <button class="key cancel" type="button"><span class="key-face">Cancel</span></button>

    </div>
  </article>
  <footer aria-label="Mockup controls">
    <label>Palette <select id="palette"><option>Cobalt</option><option>Sage</option><option>Plum</option></select></label>
    <label>Appearance <select id="appearance"><option>Light</option><option>Dark</option></select></label>
  </footer>
  <p id="status" role="status">Reminder design proof</p>
</main>
<dialog aria-labelledby="clock-title">
  <h2 id="clock-title">Set reminder time</h2>
  <div class="clock-layout">
    <div class="time-controls">
      <div class="time-readout">
        <input id="hours" type="text" inputmode="numeric" maxlength="2" aria-label="Hour" autocomplete="off" autofocus>
        <span class="time-separator" aria-hidden="true">:</span>
        <input id="minutes" type="text" inputmode="numeric" maxlength="2" aria-label="Minute" autocomplete="off">
      </div>
      <div class="period" aria-label="AM or PM" role="group">
        <button class="key" type="button" data-period="AM"><span class="key-face">AM</span></button>
        <button class="key" type="button" data-period="PM"><span class="key-face">PM</span></button>
      </div>
    </div>
    <div class="clock">

      <div id="numbers" role="group" aria-label="Select hour"></div>
    </div>
  </div>
  <p role="alert" id="time-error" hidden>Enter an hour from 1 to 12 and minutes from 00 to 59.</p>
  <div class="actions">
    <button class="key close-clock" type="button"><span class="key-face">Cancel</span></button>
    <button class="key primary apply-clock" type="button"><span class="key-face">Set time</span></button>
  </div>

<script>
const root = document.documentElement;
const dialog = document.querySelector('dialog');
const openButton = document.querySelector('#open-clock');
const displayedTime = document.querySelector('#selected-time');
const hoursInput = document.querySelector('#hours');
const minutesInput = document.querySelector('#minutes');
const canvas = document.querySelector('#clock-art');
const context = canvas.getContext('2d');
const forcedColors = matchMedia('(forced-colors: active)');
const periodButtons = Array.from(document.querySelectorAll('[data-period]'));
const clock = document.querySelector('.clock');
const numbers = document.querySelector('#numbers');
const timeError = document.querySelector('#time-error');
const status = document.querySelector('#status');
const pad = n => String(n).padStart(2,'0');

let saved = {hours: 11, minutes: 0, period: 'AM'};
let period = 'AM';
let mode = 'hours';

function position(index, count, radius) {
  const radians = index / count * Math.PI * 2;
  return {x: 120 + Math.sin(radians) * radius, y: 120 - Math.cos(radians) * radius};
}
function pixelCircle(centerX, centerY, radius, color) {
  context.fillStyle = color;
  for (let dy = -radius; dy <= radius; dy++) {
    const halfWidth = Math.floor(Math.sqrt(radius * radius - dy * dy));

  return {x: Math.round(71.5 + Math.sin(angle) * radius), y: Math.round(71.5 - Math.cos(angle) * radius)};

    const distance = Math.max(0, inset + radius - y, y - last + radius);

    context.fillRect(inset + corner, y, last - inset + 1 - 2 * corner, 1);

  context.fillStyle = color;
  for (let distance = 2; distance < length; distance += .5) {
    const point = dialPixel(angle,60,distance);
    const size = distance > length * .82 ? width - 1 : width;
    context.fillRect(point.x - Math.floor(size / 2),point.y - Math.floor(size / 2),size,size);

function drawClock() {
  const hour = Number(hoursInput.value);
  const minute = Number(minutesInput.value);
  const isHour = mode === 'hours';
  const validHour = hour >= 1 && hour <= 12;
  const validMinute = minutesInput.value !== '' && minute >= 0 && minute <= 59;
  const theme = getComputedStyle(root);
  const ink = variable => theme.getPropertyValue(variable).trim();
  const outline = forcedColors.matches ? 'CanvasText' : ink('--ink');
  const accent = forcedColors.matches ? 'Highlight' : ink('--accent');
  const face = forcedColors.matches ? 'Canvas' : ink('--surface');
  const edge = forcedColors.matches ? 'CanvasText' : ink('--edge');
  const selected = forcedColors.matches ? 'Canvas' : ink('--selected');
  context.clearRect(0,0,144,144);
  caseLayer(0,21,edge);
  caseLayer(1,20,selected);
  caseLayer(3,18,face);
  caseLayer(4,17,selected);
  caseLayer(6,15,edge);
  caseLayer(7,14,face);
  for (let index = 0; index < 60; index++) {
    const cardinal = index % 15 === 0;
    const major = index % 5 === 0;
    const dot = dialPixel(index,60,56);
    context.fillStyle = cardinal ? accent : major ? edge : ink('--divider');
    context.fillRect(dot.x - (cardinal ? 1 : 0),dot.y - (cardinal ? 1 : 0),cardinal ? 3 : major ? 2 : 1,cardinal ? 3 : major ? 2 : 1);
  }
  if (validHour) drawHand((hour % 12) * 5 + (validMinute ? minute / 12 : 0),27,4,isHour ? accent : outline);
  if (validMinute) drawHand(minute,37,3,isHour ? outline : accent);
  const selectedPosition = isHour ? (hour % 12) * 5 : minute;
  if (isHour ? validHour : validMinute) {
    const mark = dialPixel(selectedPosition,60,56);
    context.fillStyle = accent;
    context.fillRect(mark.x-1,mark.y-1,4,4);
  }
  pixelCircle(72,72,4,outline);
  pixelCircle(72,72,2,forcedColors.matches ? 'Highlight' : ink('--secondary'));

    button.setAttribute('aria-pressed', (isHour ? validHour : validMinute) && Number(button.dataset.value) === (isHour ? hour : minute));
  }

  const isHour = mode === 'hours';
  hoursInput.toggleAttribute('data-current',isHour);
  minutesInput.toggleAttribute('data-current',!isHour);
  numbers.setAttribute('aria-label',isHour ? 'Select hour' : 'Select minute');
  const labels = Array.from({length:12}, (_, index) => {
    const value = isHour ? index || 12 : index * 5;
    const point = position(index, 12, 240 * 45 / 144);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'dial-number';
    button.dataset.value = value;
    const label = document.createElement('span');
    label.className = 'dial-label';
    label.textContent = isHour ? value : pad(value);
    button.append(label);
    bindPress(button);
    button.setAttribute('aria-label', value + (isHour ? ' hours' : ' minutes'));

    button.style.top = point.y / 2.4 + '%';

    return button;
  });

}

    hoursInput.value = value;
    setDial('minutes');
    if (focusMinutes) minutesInput.focus();

  for (const button of periodButtons) button.setAttribute('aria-pressed', button.dataset.period === period);
}

  timeError.hidden = true;
  dialog.showModal();

  const minutes = Number(minutesInput.value);
  const validHour = /^\d{1,2}$/.test(hoursInput.value) && hours >= 1 && hours <= 12;
  const validMinute = /^\d{1,2}$/.test(minutesInput.value) && minutes >= 0 && minutes < 60;
  if (!validHour || !validMinute) {
    timeError.hidden = false;
    (validHour ? minutesInput : hoursInput).focus();
    return;

  dialog.close();

};

  if (dialog.open) drawClock();
};
forcedColors.addEventListener('change', () => { if (dialog.open) drawClock(); });

  button.addEventListener('keydown', event => {
    if (event.key === ' ' || event.key === 'Enter') button.setAttribute('data-pressed','');
  });
  for (const event of ['keyup','blur']) button.addEventListener(event, () => button.removeAttribute('data-pressed'));
}
for (const button of document.querySelectorAll('.key')) bindPress(button);
</script>
